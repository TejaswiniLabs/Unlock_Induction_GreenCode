{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>FoodShare</title>
    <link
        rel="stylesheet"
        href="{% static 'css/style.css' %}"
    >
</head>
<body>
    <nav class="navbar">
        <div class="logo">
            Food<span>Share</span>
        </div>
        {% if user.is_authenticated %}
        <div class="nav-links">
            <a href="{% url 'volunteer_dashboard' %}">
                Dashboard
            </a>
            <a href="{% url 'logout' %}">
                Logout
            </a>
        </div>
        {% endif %}
    </nav>
    <main class="container">
        {% block content %}
        {% endblock %}
    </main>
</body>
</html>
